runtime:
  python_bin: python3
  accelerate_config: foreact/config/deepspeed/zero2.yaml
  model_dir: &model_dir pretrained/cosmos2
  data_root_dir: &data_root data/libero/lerobot_v30
  output_root: &output_root outputs
  run_name: &run_name foreact_libero
  append_timestamp: true
  gpu_ids: "0,1,2,3"
  nproc_per_node: null
  main_process_port: 29531
  steps: &steps 100000
  per_device_batch_size: &batch_size 12
  num_workers: &workers 1
  save_every: &save_every 5000
  log_every: &log_every 10
  warmup_steps: &warmup 5000
  seed: &seed 42
  gradient_accumulation_steps: &accumulation 1
  resume: none
  write_checkpoints: true
  wandb_mode: offline
  omp_num_threads: 8
  cuda_allocator_config: expandable_segments:True
  nccl_async_error_handling: 1

run_id: *run_name
run_root_dir: *output_root
seed: *seed
version_id: "0.21"
is_debug: false
wandb_entity: null
wandb_project: ForeAct

framework:
  name: CosmoPredict2GR00T
  world_model:
    base_wm: *model_dir
    extract_layers: [-1]
    internal_depth_tokens:
      enabled: true
      num_tokens: 8
      position_mode: global
      head_dim: 256
      coord_dim: 128
      seed_grid: [10, 18]
      num_res_blocks: 2
      vae_seed_fusion:
        enabled: true
        input_channels: 16
        downsample_factor: 4
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

prompt:
  template: >-
    Robot task: {instruction}. Predict the depth of the next observation frame
    and the next 8 robot actions.

depth:
  enabled: true
  supervision_enabled: true
  normalization: genception_median_log
  median_scope: frame
  log_alpha: 0.8613366
  min_depth_m: 0.05
  max_depth_m: 10.0
  action_loss_weight: 1.0
  loss_weight: 0.01
  latent_loss_weight: 1.0
  pixel_loss_weight: 0.10
  gradient_loss_weight: 0.05
  backbone_gradient_scale: 0.01
  decoder_gradient_checkpointing: true
  decode_in_train: false

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: *data_root
    data_mix: libero_all_v30_main
    include_state: false
    action_mode: abs
    per_device_batch_size: *batch_size
    num_workers: *workers
    persistent_workers: false
    prefetch_factor: 2
    pin_memory: true
    balance_dataset_weights: false
    balance_trajectory_weights: false
    obs_image_size: [224, 224]
    obs_image_size_hw: [224, 224]
    obs_image_crop_xyxy: null
    video_backend: torchvision_av
    lerobot_version: v3.0
    depth_cache_root: data/depth/libero_next1_moge3
    depth_cache_horizon: 1
    depth_frame_offsets: [1]
    depth_model_size: [320, 576]
    depth_episodes_per_directory: 1000
    depth_cache_lru_size: 4
    depth_normalization: genception_median_log
    depth_median_scope: frame
    depth_log_alpha: 0.8613366
    min_depth_m: 0.05
    max_depth_m: 10.0
    require_depth: true

trainer:
  max_train_steps: *steps
  num_warmup_steps: *warmup
  save_interval: *save_every
  eval_interval: 1000
  logging_frequency: *log_every
  gradient_accumulation_steps: *accumulation
  learning_rate:
    base: 1.0e-5
    action_model: 1.0e-4
    backbone.depth_head: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: ''
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  weight_decay: 0.0
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  save_format: pt
  is_resume: false
  pretrained_checkpoint: null
