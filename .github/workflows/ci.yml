name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check public-release hygiene
        run: python scripts/check_public_release.py
      - name: Compile Python sources
        run: python -m compileall -q foreact scripts deployment tools examples/simBenchmarks
      - name: Check shell syntax
        run: |
          find scripts deployment local_deploy examples/simBenchmarks tools -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
